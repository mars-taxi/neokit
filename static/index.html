<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="NeoKr - Online Encryption & Decryption Toolkit">
<title>NeoKr - Online Crypto Toolkit</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  /* Light theme (default) */
  --bg: #f5f6fa;
  --bg-card: #ffffff;
  --bg-input: #f0f2f8;
  --bg-hover: #e5e8f0;
  --border: #dde0e8;
  --text: #1a1d2e;
  --text-secondary: #6b7294;
  --accent: #6c5ce7;
  --accent-hover: #5b4bd5;
  --accent-glow: rgba(108,92,231,0.15);
  --success: #059669;
  --warning: #d97706;
  --error: #dc2626;
  --shadow: 0 8px 30px rgba(0,0,0,0.10);
  --tip-bg: rgba(108,92,231,0.05);
  --tip-border: rgba(108,92,231,0.2);
  --radius: 10px;
  --radius-sm: 6px;
  --transition: 0.2s ease;
}

[data-theme="dark"] {
  --bg: #0f1117;
  --bg-card: #1a1d27;
  --bg-input: #141620;
  --bg-hover: #1e2230;
  --border: #2a2d3a;
  --text: #e1e4ed;
  --text-secondary: #8b91a0;
  --accent: #6c5ce7;
  --accent-hover: #7d6ff0;
  --accent-glow: rgba(108,92,231,0.3);
  --success: #00c896;
  --warning: #f59e0b;
  --error: #ef4444;
  --shadow: 0 8px 30px rgba(0,0,0,0.4);
  --tip-bg: rgba(108,92,231,0.05);
  --tip-border: rgba(108,92,231,0.2);
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
}

.header {
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(12px);
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 20px;
  font-weight: 700;
  color: var(--text);
  text-decoration: none;
}
.logo-icon {
  width: 36px;
  height: 36px;
  background: linear-gradient(135deg, var(--accent), #a855f7);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
}
.logo-dot { color: var(--accent); }

.header-actions { display: flex; gap: 8px; align-items: center; }

.version {
  font-size: 12px;
  color: var(--text-secondary);
  background: var(--bg-input);
  padding: 3px 10px;
  border-radius: 20px;
}

.lang-btn {
  font-size: 12px;
  color: var(--text-secondary);
  background: var(--bg-input);
  border: 1px solid var(--border);
  padding: 3px 10px;
  border-radius: 20px;
  cursor: pointer;
  transition: all var(--transition);
}
.lang-btn:hover { color: var(--text); border-color: var(--accent); }
.theme-btn {
  padding: 6px 12px;
  border-radius: var(--radius-sm);
  background: var(--bg-input);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  cursor: pointer;
  font-size: 15px;
  transition: all var(--transition);
}
.theme-btn:hover { color: var(--text); border-color: var(--accent); }

.container { max-width: 1200px; margin: 0 auto; padding: 24px; }

.tabs {
  display: flex;
  gap: 4px;
  background: var(--bg-card);
  padding: 4px;
  border-radius: var(--radius);
  margin-bottom: 24px;
  border: 1px solid var(--border);
}
.tab-btn {
  flex: 1;
  padding: 10px 20px;
  border: none;
  background: transparent;
  color: var(--text-secondary);
  cursor: pointer;
  border-radius: 7px;
  font-size: 14px;
  font-weight: 500;
  transition: all var(--transition);
  white-space: nowrap;
}
.tab-btn:hover { color: var(--text); }
.tab-btn.active {
  background: var(--accent);
  color: #fff;
  box-shadow: 0 2px 8px var(--accent-glow);
}

.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  margin-bottom: 20px;
}
.card-title {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.card-title .icon {
  width: 28px;
  height: 28px;
  background: var(--accent-glow);
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
}

.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

@media (max-width: 768px) {
  .two-col { grid-template-columns: 1fr; }
  .tabs { flex-wrap: wrap; }
  .tab-btn { flex: auto; }
}

.form-group { margin-bottom: 16px; }
.form-group label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
select, textarea, input[type="text"], input[type="number"] {
  width: 100%;
  padding: 10px 14px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-size: 14px;
  font-family: inherit;
  transition: border-color var(--transition);
  resize: vertical;
}
select:focus, textarea:focus, input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
}
textarea { min-height: 120px; font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; }
input[readonly], textarea[readonly] { color: var(--text-secondary); }

.inline-group { display: flex; gap: 10px; align-items: flex-end; }
.inline-group .form-group { flex: 1; }

.btn {
  padding: 10px 20px;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: all var(--transition);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}
.btn-primary {
  background: var(--accent);
  color: #fff;
}
.btn-primary:hover {
  background: var(--accent-hover);
  box-shadow: 0 4px 12px var(--accent-glow);
  transform: translateY(-1px);
}
.btn-secondary {
  background: var(--bg-input);
  color: var(--text);
  border: 1px solid var(--border);
}
.btn-secondary:hover { background: var(--bg-hover); border-color: var(--accent); }
.btn-success { background: var(--success); color: #000; }
.btn-success:hover { opacity: 0.9; }
.btn-warning { background: var(--warning); color: #000; }
.btn-warning:hover { opacity: 0.9; }
.btn-sm { padding: 6px 14px; font-size: 12px; }
.btn-lg { padding: 14px 28px; font-size: 16px; width: 100%; }
.btn-group { display: flex; gap: 8px; flex-wrap: wrap; }

.tip {
  background: rgba(245, 158, 11, 0.1);
  border: 1px solid rgba(245, 158, 11, 0.3);
  border-radius: var(--radius-sm);
  padding: 12px 16px;
  font-size: 13px;
  color: var(--warning);
  margin-top: 12px;
  display: flex;
  align-items: flex-start;
  gap: 8px;
}
.tip-icon { font-size: 16px; flex-shrink: 0; }

.result-actions {
  display: flex;
  gap: 8px;
  margin-top: 8px;
  justify-content: flex-end;
}
.result-actions button {
  padding: 7px 16px;
  border-radius: 6px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  cursor: pointer;
  font-size: 13px;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: all var(--transition);
  font-family: inherit;
}
.result-actions button:hover { color: var(--text); border-color: var(--accent); background: var(--bg-hover); }

.options-row {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 12px;
  margin-bottom: 16px;
}

.key-textarea { min-height: 100px; font-size: 12px; font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; }

.toast {
  position: fixed;
  top: 80px;
  right: 24px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 20px;
  box-shadow: var(--shadow);
  z-index: 1000;
  animation: slideIn 0.3s ease;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 14px;
}
.toast.success { border-left: 4px solid var(--success); }
.toast.error { border-left: 4px solid var(--error); }
.toast.fadeout { animation: slideOut 0.3s ease forwards; }

@keyframes slideIn {
  from { transform: translateX(100%); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}
@keyframes slideOut {
  from { transform: translateX(0); opacity: 1; }
  to { transform: translateX(100%); opacity: 0; }
}

.spinner {
  display: inline-block;
  width: 16px;
  height: 16px;
  border: 2px solid rgba(255,255,255,0.3);
  border-radius: 50%;
  border-top-color: #fff;
  animation: spin 0.6s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.footer {
  text-align: center;
  padding: 24px;
  color: var(--text-secondary);
  font-size: 13px;
  border-top: 1px solid var(--border);
  margin-top: 40px;
}
.footer a { color: var(--accent); text-decoration: none; }

.tab-content { display: none; }
.tab-content.active { display: block; }
</style>
</head>
<body>

<header class="header">
  <a href="/" class="logo">
    <div class="logo-icon">&#128272;</div>
    NeoKr<span class="logo-dot">.</span>
  </a>
  <div class="header-actions">
    <button class="theme-btn" onclick="toggleTheme()" title="Toggle theme" id="theme-btn">☀️</button>
    <button class="lang-btn" onclick="toggleLang()" title="Switch Language">🌐 <span id="lang-label">EN</span></button>
    <span class="version">v1.1</span>
  </div>
</header>

<div class="container">

  <div class="tabs">
    <button class="tab-btn active" data-tab="symmetric" data-i18n="tab.symmetric"></button>
    <button class="tab-btn" data-tab="hash" data-i18n="tab.hash"></button>
    <button class="tab-btn" data-tab="rsa" data-i18n="tab.rsa"></button>
    <button class="tab-btn" data-tab="base64" data-i18n="tab.base64"></button>
    <button class="tab-btn" data-tab="generator" data-i18n="tab.generator"></button>
  </div>

  <!-- ==================== TAB 1: Symmetric Encryption ==================== -->
  <div id="tab-symmetric" class="tab-content active">
    <div class="card">
      <div class="card-title"><div class="icon">⚙️</div> <span data-i18n="sym.title"></span></div>
      <div class="options-row">
        <div class="form-group">
          <label data-i18n="sym.operation"></label>
          <select id="sym-mode">
            <option value="encrypt" data-i18n="sym.encrypt"></option>
            <option value="decrypt" data-i18n="sym.decrypt"></option>
          </select>
        </div>
        <div class="form-group">
          <label data-i18n="sym.algorithm"></label>
          <select id="sym-algorithm">
            <option value="aes">AES</option>
            <option value="des">DES</option>
            <option value="3des">3DES</option>
          </select>
        </div>
        <div class="form-group" id="sym-keysize-group">
          <label data-i18n="sym.keySize"></label>
          <select id="sym-keysize">
            <option value="128">128 bits</option>
            <option value="192">192 bits</option>
            <option value="256">256 bits</option>
          </select>
        </div>
        <div class="form-group">
          <label data-i18n="sym.cipherMode"></label>
          <select id="sym-cipher-mode">
            <option value="cbc">CBC</option>
            <option value="ecb">ECB</option>
            <option value="ctr">CTR</option>
            <option value="gcm">GCM</option>
          </select>
        </div>
        <div class="form-group">
          <label data-i18n="sym.encoding"></label>
          <select id="sym-encoding">
            <option value="base64">Base64</option>
            <option value="hex">Hex</option>
          </select>
        </div>
      </div>

      <div class="two-col">
        <div>
          <div class="form-group">
            <label id="sym-input-label" data-i18n="sym.inputPlain"></label>
            <textarea id="sym-input" data-i18n-placeholder="sym.placeholderPlain"></textarea>
          </div>
          <div class="form-group">
            <label data-i18n="sym.key"></label>
            <div class="inline-group">
              <input type="text" id="sym-key" data-i18n-placeholder="sym.placeholderKey" style="flex:1">
              <button class="btn btn-secondary btn-sm" onclick="generateSymmetricKey()" data-i18n-title="sym.genKey" data-i18n="gen.generate"></button>
            </div>
          </div>
          <div class="form-group" id="sym-iv-group">
            <label><span data-i18n="sym.iv"></span> <span id="sym-iv-hint" data-i18n="sym.ivHint"></span></label>
            <div class="inline-group">
              <input type="text" id="sym-iv" data-i18n-placeholder="sym.placeholderIV">
              <button class="btn btn-secondary btn-sm" onclick="generateIV()" data-i18n-title="sym.genIV" data-i18n="gen.generate"></button>
            </div>
          </div>
        </div>
        <div>
          <div class="form-group">
            <label id="sym-output-label" data-i18n="sym.outputCipher"></label>
            <textarea id="sym-output" readonly data-i18n-placeholder="sym.placeholderResult"></textarea>
          </div>
          <div class="result-actions" id="sym-result-actions" style="display:none">
            <button onclick="copyToClipboard('sym-output')" data-i18n-title="common.copy"><span data-i18n="common.copyBtn"></span></button>
            <button onclick="downloadResult('sym-output')" data-i18n-title="common.download"><span data-i18n="common.downloadBtn"></span></button>
          </div>
          <button class="btn btn-primary btn-lg" id="sym-submit-btn" onclick="handleSymmetric()"></button>
          <div id="sym-tip-area"></div>
        </div>
      </div>
    </div>

    <div class="card" style="background:rgba(108,92,231,0.05);border-color:rgba(108,92,231,0.2);">
      <div style="font-size:14px;color:var(--text-secondary);line-height:1.8;" data-i18n-html="sym.help"></div>
    </div>
  </div>

  <!-- ==================== TAB 2: Hash / HMAC ==================== -->
  <div id="tab-hash" class="tab-content">
    <div class="card">
      <div class="card-title"><div class="icon">🔢</div> <span data-i18n="hash.title"></span></div>
      <div class="two-col">
        <div>
          <div class="form-group">
            <label data-i18n="hash.type"></label>
            <select id="hash-type" onchange="toggleHashType()">
              <option value="hash" data-i18n="hash.hash"></option>
              <option value="hmac" data-i18n="hash.hmac"></option>
            </select>
          </div>
          <div class="form-group">
            <label data-i18n="hash.algorithm"></label>
            <select id="hash-algorithm">
              <option value="md5">MD5</option>
              <option value="sha1">SHA-1</option>
              <option value="sha256">SHA-256</option>
              <option value="sha512">SHA-512</option>
            </select>
          </div>
          <div class="form-group" id="hmac-algo-group" style="display:none">
            <label data-i18n="hash.hmacAlgo"></label>
            <select id="hmac-algorithm">
              <option value="hmac-sha256">HMAC-SHA256</option>
              <option value="hmac-sha512">HMAC-SHA512</option>
            </select>
          </div>
          <div class="form-group" id="hmac-key-group" style="display:none">
            <label data-i18n="hash.hmacKey"></label>
            <div class="inline-group">
              <input type="text" id="hmac-key" data-i18n-placeholder="hash.placeholderKey" style="flex:1">
              <button class="btn btn-secondary btn-sm" onclick="generateHMACKey()" data-i18n-title="hash.genKey" data-i18n="gen.generate"></button>
            </div>
          </div>
          <div class="form-group">
            <label data-i18n="hash.inputData"></label>
            <textarea id="hash-input" data-i18n-placeholder="hash.placeholderData"></textarea>
          </div>
          <button class="btn btn-primary btn-lg" onclick="handleHash()" data-i18n="hash.compute"></button>
        </div>
        <div>
          <div class="form-group">
            <label data-i18n="hash.output"></label>
            <textarea id="hash-output" readonly data-i18n-placeholder="hash.placeholderResult"></textarea>
          </div>
          <div class="result-actions" id="hash-result-actions" style="display:none">
            <button onclick="copyToClipboard('hash-output')" data-i18n-title="common.copy"><span data-i18n="common.copyBtn"></span></button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ==================== TAB 3: RSA ==================== -->
  <div id="tab-rsa" class="tab-content">
    <div class="card">
      <div class="card-title"><div class="icon">🔑</div> <span data-i18n="rsa.title"></span></div>

      <div class="card" style="background:rgba(245,158,11,0.05);border-color:rgba(245,158,11,0.2);margin-bottom:16px;">
        <div class="inline-group">
          <div class="form-group" style="margin-bottom:0">
            <label data-i18n="rsa.keySize"></label>
            <select id="rsa-keysize">
              <option value="2048">2048 bits</option>
              <option value="4096">4096 bits</option>
            </select>
          </div>
          <div class="form-group" style="margin-bottom:0">
            <label>&nbsp;</label>
            <button class="btn btn-warning" onclick="generateRSAKeys()" style="height:42px" data-i18n="rsa.genKeypair"></button>
          </div>
        </div>
        <div class="tip" style="margin-top:12px">
          <span class="tip-icon">⚠️</span>
          <div data-i18n-html="rsa.saveWarning"></div>
        </div>
      </div>

      <div class="two-col">
        <div>
          <div class="form-group">
            <label data-i18n="rsa.publicKey"></label>
            <textarea id="rsa-public-key" class="key-textarea" readonly data-i18n-placeholder="rsa.placeholderPubKey"></textarea>
          </div>
          <div class="form-group">
            <label data-i18n="rsa.privateKey"></label>
            <textarea id="rsa-private-key" class="key-textarea" readonly data-i18n-placeholder="rsa.placeholderPrivKey"></textarea>
            <div class="btn-group" style="margin-top:8px">
              <button class="btn btn-secondary btn-sm" onclick="copyToClipboard('rsa-public-key')" data-i18n="rsa.copyPubKey"></button>
              <button class="btn btn-secondary btn-sm" onclick="copyToClipboard('rsa-private-key')" data-i18n="rsa.copyPrivKey"></button>
              <button class="btn btn-secondary btn-sm" onclick="downloadRSAKeys()" data-i18n="rsa.downloadKeys"></button>
            </div>
          </div>
        </div>
        <div>
          <div class="form-group">
            <label data-i18n="rsa.operation"></label>
            <select id="rsa-mode">
              <option value="encrypt" data-i18n="rsa.pubEncrypt"></option>
              <option value="decrypt" data-i18n="rsa.privDecrypt"></option>
            </select>
          </div>
          <div class="form-group">
            <label data-i18n="rsa.inputData"></label>
            <textarea id="rsa-input" data-i18n-placeholder="rsa.placeholderData"></textarea>
          </div>
          <button class="btn btn-primary btn-lg" onclick="handleRSA()" id="rsa-submit-btn" data-i18n="common.execute"></button>
          <div class="form-group" style="margin-top:16px">
            <label data-i18n="rsa.output"></label>
            <textarea id="rsa-output" readonly data-i18n-placeholder="rsa.placeholderResult"></textarea>
          </div>
          <div class="result-actions" id="rsa-result-actions" style="display:none">
            <button onclick="copyToClipboard('rsa-output')" data-i18n-title="common.copy"><span data-i18n="common.copyBtn"></span></button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ==================== TAB 4: Base64 ==================== -->
  <div id="tab-base64" class="tab-content">
    <div class="card">
      <div class="card-title"><div class="icon">📝</div> <span data-i18n="base64.title"></span></div>
      <div class="two-col">
        <div>
          <div class="form-group">
            <label data-i18n="base64.input"></label>
            <textarea id="base64-input" data-i18n-placeholder="base64.placeholderInput"></textarea>
          </div>
          <div class="btn-group">
            <button class="btn btn-primary" onclick="handleBase64('encode')" data-i18n="base64.encode"></button>
            <button class="btn btn-secondary" onclick="handleBase64('decode')" data-i18n="base64.decode"></button>
          </div>
        </div>
        <div>
          <div class="form-group">
            <label data-i18n="base64.output"></label>
            <textarea id="base64-output" readonly data-i18n-placeholder="base64.placeholderResult"></textarea>
          </div>
          <div class="result-actions" id="base64-result-actions" style="display:none">
            <button onclick="copyToClipboard('base64-output')" data-i18n-title="common.copy"><span data-i18n="common.copyBtn"></span></button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ==================== TAB 5: Generator ==================== -->
  <div id="tab-generator" class="tab-content">
    <div class="card">
      <div class="card-title"><div class="icon">🎲</div> <span data-i18n="gen.title"></span></div>
      <div class="tip" style="margin-bottom:20px">
        <span class="tip-icon">🔒</span>
        <div data-i18n-html="gen.csprngWarning"></div>
      </div>

      <div class="two-col">
        <div class="card" style="background:var(--bg-input)">
          <div class="card-title" style="font-size:15px" data-i18n="gen.keyTitle"></div>
          <div class="inline-group">
            <div class="form-group">
              <label data-i18n="gen.length"></label>
              <input type="number" id="gen-key-length" value="32" min="1" max="1024" style="width:100px">
            </div>
            <div class="form-group">
              <label data-i18n="gen.format"></label>
              <select id="gen-key-format" style="width:100px">
                <option value="hex">Hex</option>
                <option value="base64">Base64</option>

let currentLang = 'zh-CN';

function detectLang() {
  const lang = navigator.language || navigator.userLanguage || 'en';
  return lang.startsWith('zh') ? 'zh-CN' : 'en';
}

function t(key) {
  // Get translation; fallback to zh-CN, then key itself
  return (I18N[currentLang] && I18N[currentLang][key]) || (I18N['zh-CN'] && I18N['zh-CN'][key]) || key;
}

function applyI18n() {
  // Update html lang attribute
  document.documentElement.lang = currentLang;

  // Update elements with data-i18n (text content)
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    el.textContent = t(key);
  });

  // Update elements with data-i18n-html (innerHTML)
  document.querySelectorAll('[data-i18n-html]').forEach(el => {
    const key = el.getAttribute('data-i18n-html');
    el.innerHTML = t(key);
  });

  // Update placeholders
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    const key = el.getAttribute('data-i18n-placeholder');
    el.placeholder = t(key);
  });

  // Update titles
  document.querySelectorAll('[data-i18n-title]').forEach(el => {
    const key = el.getAttribute('data-i18n-title');
    el.title = t(key);
  });

  // Update lang switch button label
  const langLabel = document.getElementById('lang-label');
  if (langLabel) {
    langLabel.textContent = currentLang === 'zh-CN' ? 'EN' : '中文';
  }

  // Update page title
  document.title = currentLang === 'zh-CN' ? 'NeoKr - 在线加解密工具' : 'NeoKr - Online Crypto Toolkit';

  // Update page description
  const metaDesc = document.querySelector('meta[name="description"]');
  if (metaDesc) {
    metaDesc.content = currentLang === 'zh-CN'
      ? 'NeoKr - 在线加解密工具站，支持AES/DES/3DES/RSA/哈希/Base64等常见加解密算法'
      : 'NeoKr - Online encryption & decryption toolkit. Supports AES/DES/3DES/RSA/Hash/Base64 and more.';
  }

  // Re-apply dynamic UI updates
  updateSymUI();
}

// ========== Theme Management ==========

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  const btn = document.getElementById('theme-btn');
  btn.innerHTML = theme === 'dark' ? '🌙' : '☀️';
  btn.title = theme === 'dark' ? 'Switch to Light Mode' : 'Switch to Dark Mode';
}

function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme') || 'light';
  const next = current === 'dark' ? 'light' : 'dark';
  localStorage.setItem('neokr_theme', next);
  applyTheme(next);
}

// Initialize theme (default: light)
(function() {
  const saved = localStorage.getItem('neokr_theme') || 'light';
  applyTheme(saved);
})();

function toggleLang() {
  currentLang = currentLang === 'zh-CN' ? 'en' : 'zh-CN';
  localStorage.setItem('neokr_lang', currentLang);
  applyI18n();
}

// Init language from browser detection or localStorage
(function() {
  const saved = localStorage.getItem('neokr_lang');
  currentLang = saved || detectLang();
  // Apply on DOM ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', applyI18n);
  } else {
    applyI18n();
  }
})();

// ========== Tab Switching ==========
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
  });
});

function updateSymModeOptions() {
  // Only called when algorithm changes — rebuilds cipher mode dropdown options

  lastAlgo = algo;

  // Save current mode selection before rebuild
  const currentMode = symCipherMode.value;

  symKeySizeGroup.style.display = algo === 'aes' ? '' : 'none';

  let options = '';
  if (algo === 'des' || algo === '3des') {
    options = '<option value="cbc">CBC</option><option value="ecb">ECB</option>';
  } else {
    options = '<option value="cbc">CBC</option><option value="ecb">ECB</option><option value="ctr">CTR</option><option value="gcm">GCM</option>';
  }
  symCipherMode.innerHTML = options;

  // Restore previous selection if the option still exists
  const validOptions = algo === 'des' || algo === '3des' ? ['cbc', 'ecb'] : ['cbc', 'ecb', 'ctr', 'gcm'];
  if (validOptions.includes(currentMode)) {
    symCipherMode.value = currentMode;
  }
}

function updateSymUI() {
  const isEncrypt = symMode.value === 'encrypt';
  symInputLabel.textContent = t(isEncrypt ? 'sym.inputPlain' : 'sym.inputCipher');
  symOutputLabel.textContent = t(isEncrypt ? 'sym.outputCipher' : 'sym.outputPlain');
  symSubmitBtn.textContent = t(isEncrypt ? 'sym.submitEncrypt' : 'sym.submitDecrypt');
  const inputEl = document.getElementById('sym-input');
  inputEl.placeholder = t(isEncrypt ? 'sym.placeholderPlain' : 'sym.placeholderCipher');

  // Update IV visibility based on cipher mode
  const mode = symCipherMode.value;
  symIVGroup.style.display = mode === 'ecb' ? 'none' : '';
  symIVHint.textContent = mode === 'gcm'
    ? (currentLang === 'zh-CN' ? '(GCM: 12字节 Nonce)' : '(GCM: 12-byte Nonce)')
    : (currentLang === 'zh-CN' ? '(CBC/CTR: 16字节)' : '(CBC/CTR: 16 bytes)');
}

// Algorithm change: rebuild mode options then update UI
symAlgorithm.addEventListener('change', () => {
  updateSymModeOptions();
  updateSymUI();
});

// Mode change: only update labels and IV visibility (no innerHTML reset!)
symMode.addEventListener('change', updateSymUI);
symCipherMode.addEventListener('change', updateSymUI);

// Initial setup
updateSymModeOptions();
updateSymUI();

// ========== Hash / HMAC ==========
function toggleHashType() {
  const type = document.getElementById('hash-type').value;
  const isHmac = type === 'hmac';
  document.getElementById('hmac-algo-group').style.display = isHmac ? '' : 'none';
  document.getElementById('hmac-key-group').style.display = isHmac ? '' : 'none';
  document.getElementById('hash-algorithm').style.display = isHmac ? 'none' : '';
}
toggleHashType();

// HMAC Key Generation
async function generateHMACKey() {
  try {
    const result = await apiCall('/api/generate-key', { length: 32, format: 'hex' });
    document.getElementById('hmac-key').value = result.result;
    showToast(t('toast.keyGenerated') + ' (' + result.length + ')', 'success');

    showToast(t('toast.keyGenFailed') + err.message, 'error');

// ========== Utility Functions ==========
function showToast(message, type) {
  type = type || 'success';
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();

  const toast = document.createElement('div');
  toast.className = 'toast ' + type;
  toast.innerHTML = '<span>' + (type === 'success' ? '✅' : '❌') + '</span> ' + message;
  document.body.appendChild(toast);

  setTimeout(() => {
    toast.classList.add('fadeout');
    setTimeout(() => toast.remove(), 300);
  }, 3000);
}

async function apiCall(url, data) {
  const resp = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  });
  const result = await resp.json();
  if (!resp.ok) throw new Error(result.error || t('toast.requestFailed'));
  return result;
}

function copyToClipboard(textareaId) {
  const el = document.getElementById(textareaId);
  el.select();
  document.execCommand('copy');
  showToast(t('toast.copied'), 'success');
}

function downloadResult(textareaId) {
  const el = document.getElementById(textareaId);
  const content = el.value;
  const blob = new Blob([content], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'neokr_result_' + new Date().toISOString().slice(0,10) + '.txt';
  a.click();
  URL.revokeObjectURL(url);
  showToast(t('toast.downloaded'), 'success');
}

function showResultActions(id) {
  document.getElementById(id).style.display = 'flex';
}

// ========== Symmetric Encrypt/Decrypt ==========
async function handleSymmetric() {
  const mode = symMode.value;
  const algorithm = symAlgorithm.value;
  const plaintext = document.getElementById('sym-input').value;
  const key = document.getElementById('sym-key').value;
  const cipherMode = symCipherMode.value;
  const iv = cipherMode !== 'ecb' ? document.getElementById('sym-iv').value : '';
  const keySize = parseInt(document.getElementById('sym-keysize').value);
  const encoding = document.getElementById('sym-encoding').value;

  if (!plaintext) { showToast(t('toast.enterData'), 'error'); return; }
  if (!key) { showToast(t('toast.enterKey'), 'error'); return; }
  if (cipherMode !== 'ecb' && !iv) { showToast(t('toast.needIV'), 'error'); return; }

  symSubmitBtn.disabled = true;
  symSubmitBtn.innerHTML = '<span class="spinner"></span> ' + t('sym.processing');

  try {
    const url = mode === 'encrypt' ? '/api/encrypt' : '/api/decrypt';
    const reqData = mode === 'encrypt'
      ? { algorithm, mode: cipherMode, plaintext, key, iv, keySize, encoding }
      : { algorithm, mode: cipherMode, ciphertext: plaintext, key, iv, keySize, encoding };

    const result = await apiCall(url, reqData);
    document.getElementById('sym-output').value = result.result;
    showResultActions('sym-result-actions');

    document.getElementById('sym-tip-area').innerHTML = '';
    if (mode === 'encrypt') {
      document.getElementById('sym-tip-area').innerHTML = `
        <div class="tip">
          <span class="tip-icon">⚠️</span>
          <div>${t('toast.encryptTip')}</div>
        </div>`;
    }
    showToast(t(mode === 'encrypt' ? 'toast.encryptSuccess' : 'toast.decryptSuccess'), 'success');
  } catch (err) {
    showToast(err.message, 'error');
  } finally {
    symSubmitBtn.disabled = false;
    symSubmitBtn.textContent = t(mode === 'encrypt' ? 'sym.submitEncrypt' : 'sym.submitDecrypt');
  }
}

// ========== Generate Symmetric Key ==========
async function generateSymmetricKey() {
  const algo = symAlgorithm.value;
  let length;
  if (algo === 'aes') {
    const ks = parseInt(document.getElementById('sym-keysize').value);
    length = ks / 8;
  } else if (algo === 'des') {
    length = 8;
  } else {
    length = 24;
  }

  try {
    const result = await apiCall('/api/generate-key', { length, format: 'hex' });
    document.getElementById('sym-key').value = result.result;
    document.getElementById('sym-key').style.borderColor = 'var(--success)';
    showToast(t('toast.keyGenerated') + ' (' + result.length + ')', 'success');
    setTimeout(() => {
      document.getElementById('sym-key').style.borderColor = 'var(--border)';
    }, 2000);
  } catch (err) {
    showToast(t('toast.keyGenFailed') + err.message, 'error');
  }
}

// ========== Generate IV ==========
async function generateIV() {
  const mode = symCipherMode.value;
  const length = mode === 'gcm' ? 12 : 16;

  try {
    const result = await apiCall('/api/generate-iv', { length, format: 'hex' });
    document.getElementById('sym-iv').value = result.result;
    document.getElementById('sym-iv').style.borderColor = 'var(--success)';
    showToast(t('toast.ivGenerated') + ' (' + result.length + ')', 'success');
    setTimeout(() => {
      document.getElementById('sym-iv').style.borderColor = 'var(--border)';
    }, 2000);
  } catch (err) {
    showToast(t('toast.ivGenFailed') + err.message, 'error');
  }
}

// ========== Hash ==========
async function handleHash() {
  const type = document.getElementById('hash-type').value;
  const input = document.getElementById('hash-input').value;

  if (!input) { showToast(t('toast.enterData'), 'error'); return; }

  try {
    let result;
    if (type === 'hash') {
      const algo = document.getElementById('hash-algorithm').value;
      result = await apiCall('/api/hash', { data: input, algorithm: algo });
    } else {
      const algo = document.getElementById('hmac-algorithm').value;
      const key = document.getElementById('hmac-key').value;
      if (!key) { showToast(t('toast.hmacKeyRequired'), 'error'); return; }
      result = await apiCall('/api/hmac', { data: input, key, algorithm: algo });
    }
    document.getElementById('hash-output').value = result.result;
    showResultActions('hash-result-actions');
    showToast(t('toast.hashSuccess'), 'success');
  } catch (err) {
    showToast(err.message, 'error');
  }
}

// ========== RSA ==========
async function generateRSAKeys() {
  const keySize = parseInt(document.getElementById('rsa-keysize').value);
  try {
    const result = await apiCall('/api/rsa-generate', { keySize });
    document.getElementById('rsa-public-key').value = result.publicKey;
    document.getElementById('rsa-private-key').value = result.privateKey;
    document.getElementById('rsa-public-key').style.borderColor = 'var(--success)';
    document.getElementById('rsa-private-key').style.borderColor = 'var(--success)';
    showToast(t('toast.rsaKeyGenerated') + ' (' + result.keySize + ')', 'success');
    setTimeout(() => {
      document.getElementById('rsa-public-key').style.borderColor = 'var(--border)';
      document.getElementById('rsa-private-key').style.borderColor = 'var(--border)';
    }, 3000);
  } catch (err) {
    showToast(err.message, 'error');
  }
}

function downloadRSAKeys() {
  const pub = document.getElementById('rsa-public-key').value;
  const priv = document.getElementById('rsa-private-key').value;
  if (!pub || !priv) { showToast('Please generate RSA keys first', 'error'); return; }

  const content = '=== RSA PUBLIC KEY ===\n' + pub + '\n\n=== RSA PRIVATE KEY ===\n' + priv;
  const blob = new Blob([content], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'rsa_keypair_' + new Date().toISOString().slice(0,10) + '.pem';
  a.click();
  URL.revokeObjectURL(url);
  showToast(t('toast.rsaKeyDownloaded'), 'success');
}

async function handleRSA() {
  const mode = document.getElementById('rsa-mode').value;
  const data = document.getElementById('rsa-input').value;
  const pubKey = document.getElementById('rsa-public-key').value;
  const privKey = document.getElementById('rsa-private-key').value;

  if (!data) { showToast(t('toast.enterData'), 'error'); return; }

  const btn = document.getElementById('rsa-submit-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> ' + t('sym.processing');

  try {
    let result;
    if (mode === 'encrypt') {
      if (!pubKey) { showToast(currentLang === 'zh-CN' ? '请提供公钥（生成或粘贴）' : 'Please provide a public key', 'error'); return; }
      result = await apiCall('/api/rsa-encrypt', { data, publicKey: pubKey });
    } else {
      if (!privKey) { showToast(currentLang === 'zh-CN' ? '请提供私钥（生成或粘贴）' : 'Please provide a private key', 'error'); return; }
      result = await apiCall('/api/rsa-decrypt', { data, privateKey: privKey });
    }
    document.getElementById('rsa-output').value = result.result;
    showResultActions('rsa-result-actions');
    showToast(t(mode === 'encrypt' ? 'toast.rsaEncryptSuccess' : 'toast.rsaDecryptSuccess'), 'success');
  } catch (err) {
    showToast(err.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = t('common.execute');
  }
}

// ========== Base64 ==========
async function handleBase64(mode) {
  const input = document.getElementById('base64-input').value;
  if (!input) { showToast(t('toast.enterData'), 'error'); return; }

  try {
    const url = mode === 'encode' ? '/api/base64-encode' : '/api/base64-decode';
    const result = await apiCall(url, { data: input });
    document.getElementById('base64-output').value = result.result;
    showResultActions('base64-result-actions');
    showToast(t(mode === 'encode' ? 'toast.base64EncodeSuccess' : 'toast.base64DecodeSuccess'), 'success');
  } catch (err) {
    showToast(err.message, 'error');
  }
}
